[workspace]
resolver = "2"
members = [
    "crates/tinc-crypto",
    "crates/tinc-ffi",
    "crates/tinc-sptps",
    "crates/tinc-proto",
    "crates/tinc-conf",
    "crates/tinc-device",
    "crates/tincd",
    "crates/tinc-tools",
]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.91"

# priority = -1: item-level #[allow]s win over the group.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `#[expect]` only: a suppression that stops firing becomes an error.
allow_attributes = "warn"

# Thin LTO + one codegen unit: cross-crate inlining on the packet
# path (tincd → tinc-sptps → tinc-crypto). Full LTO is marginal
# and doubles link time.
# Debug-build RSA keygen takes tens of seconds without this.
[profile.dev.package.crypto-bigint]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Explicit: catch_unwind around daemon.run() is load-bearing for
# Daemon::Drop (tinc-down, pidfile) — `abort` would skip it.
panic = "unwind"

# `--profile profiling` for perf runs: release codegen + debuginfo
# so DWARF unwinding works.
[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
# Test-only (tinc-sptps vs_c.rs BridgeRng): `ChaCha20Legacy` matches
# csrc/shim.c's keystream. The hot-path AEAD is OpenSSL (tinc-crypto).
chacha20 = "0.10"
openssl-sys = "0.9"
# digest-0.11 cohort: one dalek/sha2/digest version workspace-wide.
# KATs pin the wire bytes across the 2→3-pre bump.
curve25519-dalek = { version = "5.0.0-pre.6", features = ["digest"] }
ed25519-dalek = { version = "3.0.0-pre.6", features = ["hazmat", "digest"] }
sha2 = "0.11"
hmac = "0.13"
subtle = "2.5"

zeroize = "1.7"
# PQ hybrid KEX (`SPTPSKex = x25519-mlkem768`). Handshake-time only,
# pure-Rust perf is fine.
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"] }
kem = "0.3"
# rand_core 0.10 cohort: matches ml-kem 0.3, rsa 0.10-rc and the
# dalek 3.0-pre crates. OsRng is gone; getrandom's SysRng wrapped in
# rand_core::UnwrapErr keeps the old panic-on-OS-failure semantics.
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
