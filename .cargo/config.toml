# `target-cpu=x86-64-v3` (Haswell+, AVX2): conventional distro cut
# for performance builds; lets the auto-vectorizer use AVX2 in the
# packet path (checksums, memcpy, GRO). The hot AEAD itself moved to
# OpenSSL, which runtime-dispatches its own kernels regardless of
# these flags. `tincd-compat` (nix/tincd.nix baselineCpu) drops the
# floor for pre-Haswell CPUs.
#
# `force-frame-pointers`: makes `perf record -g` (the throughput
# test's profiler) actually work. Without it, %rbp is a free register
# and perf can't unwind. Cost: one of 16 GPRs — negligible.
#
# macOS: run test binaries under sudo when passwordless sudo is
# available, so utun tests work transparently. Without sudo the
# tests skip themselves (check euid).
[target.aarch64-apple-darwin]
runner = "scripts/macos-test-runner.sh"

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes"]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "force-frame-pointers=yes",
]
