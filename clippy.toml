doc-valid-idents = [
    # Protocols / acronyms
    "DoS",
    "QoS",
    # Algorithms / crypto
    "ChaCha",
    "ChaCha20",
    "Ed25519",
    "SipHash",
    "LibTomCrypt",
    # Product / project names
    "BitTorrent",
    "MagicDNS",
    # Keep clippy's built-in list (OAuth, GraphQL, IPv4, IPv6, etc.)
    "..",
]
too-many-lines-threshold = 200

# tincd denies these outside tests (PLAN.md C2); tests may assert freely.
allow-indexing-slicing-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
